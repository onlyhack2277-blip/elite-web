<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE.WEB — Premium Digital Web Studio & Architecture</title>
    <meta name="description" content="High-speed, conversion-focused websites, e-commerce stores, and SaaS platforms engineered by ELITE.WEB.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================= APPLE / LINEAR / VERCEL DARK DESIGN SYSTEM ================= */
        :root {
            --bg-void: #030408;
            --bg-surface: #080b12;
            --bg-card: rgba(13, 17, 26, 0.72);
            --bg-card-hover: rgba(19, 25, 39, 0.88);
            --bg-elevated: #141b29;
            --accent-cyan: #00f2fe;
            --accent-blue: #3b82f6;
            --accent-violet: #8b5cf6;
            --accent-mint: #10b981;
            --accent-amber: #f59e0b;
            --accent-pink: #ec4899;
            --text-pure: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-specular: rgba(255, 255, 255, 0.16);
            --border-glow: rgba(0, 242, 254, 0.35);
            --font-display: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.theme-violet {
            --accent-cyan: #a855f7;
            --accent-blue: #6366f1;
            --border-glow: rgba(168, 85, 247, 0.4);
        }

        body.theme-emerald {
            --accent-cyan: #10b981;
            --accent-blue: #06b6d4;
            --border-glow: rgba(16, 185, 129, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-pure);
            line-height: 1.8;
            overflow-x: hidden;
            position: relative;
        }

        /* Interactive Background Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        /* Subtle Ambient Spotlights */
        .ambient-orb {
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            filter: blur(170px);
            opacity: 0.13;
            pointer-events: none;
            z-index: -1;
            transition: background 0.5s ease;
        }
        .orb-1 { top: -180px; left: -120px; background: var(--accent-cyan); }
        .orb-2 { bottom: -180px; right: -120px; background: var(--accent-blue); }

        /* Top Scroll Progress Bar */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-mint));
            width: 0%;
            z-index: 10000;
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .container {
            max-width: 1220px;
            margin: 0 auto;
            padding: 0 28px;
        }

        /* ================= SMOOTH SCROLL REVEAL ENGINE ================= */
        .reveal {
            opacity: 0;
            transform: translateY(45px);
            transition: opacity 0.9s var(--ease-smooth), transform 0.9s var(--ease-smooth);
            will-change: opacity, transform;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; }

        /* ================= STICKY GLASS HEADER ================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 4, 8, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1000;
        }
        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 74px;
            gap: 16px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
        }
        .brand-icon {
            width: 12px;
            height: 12px;
            background: var(--accent-cyan);
            border-radius: 3px;
            box-shadow: 0 0 14px var(--accent-cyan);
        }
        .brand-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-pure);
        }
        .brand-title span { color: var(--accent-cyan); }
        .studio-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            list-style: none;
        }
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-link:hover {
            color: var(--text-pure);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-sfx {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            color: var(--accent-mint);
            padding: 6px 12px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-sfx.muted { color: var(--text-muted); }

        .theme-dots {
            display: flex;
            gap: 6px;
            background: var(--bg-surface);
            padding: 5px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
        }
        .t-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: 0.2s;
        }
        .t-dot:hover, .t-dot.active {
            transform: scale(1.2);
            border-color: #fff;
        }

        .nav-order-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #030408;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            letter-spacing: 0.2px;
            box-shadow: 0 0 20px var(--border-glow);
            transition: 0.25s;
        }
        .nav-order-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* ================= SCREEN 0: 100VH CENTERPIECE SPLASH INTRO ================= */
        .splash-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 120px 24px 80px;
            border-bottom: 1px solid var(--border-glass);
        }
        .splash-pill {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 32px;
            padding: 8px 22px;
            border-radius: 40px;
            background: rgba(0, 242, 254, 0.06);
            border: 1px solid var(--border-glow);
        }
        .splash-giant-title {
            font-family: var(--font-display);
            font-size: clamp(3.8rem, 11vw, 8.8rem);
            font-weight: 900;
            letter-spacing: -0.035em;
            line-height: 1.02;
            margin-bottom: 32px;
            background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 20px 50px rgba(0, 242, 254, 0.18));
            transition: transform 0.2s ease-out;
        }
        .splash-giant-title span {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .splash-subtitle {
            font-size: clamp(1.05rem, 1.8vw, 1.3rem);
            color: var(--text-secondary);
            max-width: 640px;
            font-weight: 400;
            line-height: 1.85;
            margin-bottom: 60px;
        }

        .scroll-down-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .scroll-down-btn:hover { color: var(--accent-cyan); }
        .mouse-icon {
            width: 26px;
            height: 42px;
            border: 2px solid var(--border-glow);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            padding-top: 8px;
        }
        .mouse-wheel {
            width: 4px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 4px;
            animation: wheelMove 1.6s infinite;
        }
        @keyframes wheelMove {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(14px); opacity: 0; }
        }

        /* ================= LUXURY SECTION SPACING & TYPOGRAPHY ================= */
        .section-luxury {
            padding: 150px 0 130px;
            border-bottom: 1px solid var(--border-glass);
        }
        .eyebrow-tag {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 22px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .eyebrow-tag::before {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        .headline-luxury {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 4.5vw, 3.6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: var(--text-pure);
            margin-bottom: 26px;
        }
        .subtext-luxury {
            font-size: 17.5px;
            color: var(--text-secondary);
            max-width: 720px;
            line-height: 1.9;
            margin-bottom: 64px;
        }

        /* Sleek Modern Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #030408;
            font-weight: 700;
            font-size: 14.5px;
            padding: 16px 32px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.3s var(--ease-smooth);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.22);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(0, 242, 254, 0.38);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-pure);
            font-weight: 600;
            font-size: 14.5px;
            padding: 16px 30px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            border-top-color: var(--border-specular);
            cursor: pointer;
            transition: all 0.3s var(--ease-smooth);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: var(--bg-card-hover);
            transform: translateY(-3px);
        }

        .btn-whatsapp {
            background: #25d366;
            color: #030408;
            font-weight: 700;
            font-size: 14.5px;
            padding: 16px 30px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s var(--ease-smooth);
        }
        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(37, 211, 102, 0.4);
        }

        /* ================= 01 // EXECUTIVE HERO PITCH ================= */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-mint);
            margin-bottom: 32px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-mint);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-mint);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .hero-pitch-title {
            font-family: var(--font-display);
            font-size: clamp(2.4rem, 5.5vw, 4.4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.12;
            margin-bottom: 30px;
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-role-bar {
            font-family: var(--font-mono);
            font-size: 17px;
            color: var(--accent-cyan);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .caret-cursor {
            width: 8px;
            height: 19px;
            background: var(--accent-cyan);
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .hero-cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 80px;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
            gap: 24px;
        }
        .trust-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-top: 1px solid var(--border-specular);
            padding: 32px 26px;
            border-radius: 14px;
            backdrop-filter: blur(16px);
            transition: all 0.35s var(--ease-smooth);
        }
        .trust-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-cyan);
            background: var(--bg-card-hover);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        }
        .trust-num {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 800;
            color: var(--text-pure);
            margin-bottom: 6px;
        }
        .trust-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ================= 02 // SERVICES SECTION ================= */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
            gap: 28px;
        }
        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-top: 1px solid var(--border-specular);
            border-radius: 16px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.35s var(--ease-smooth);
        }
        .service-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-7px);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65);
        }
        .service-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 26px;
        }
        .service-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-pure);
        }
        .service-ideal {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent-cyan);
            margin-bottom: 18px;
            display: block;
            text-transform: uppercase;
        }
        .service-list {
            list-style: none;
            margin: 22px 0 34px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14.5px;
            color: var(--text-secondary);
        }

            color: var(--accent-mint);
